<base target="_parent"/>

<div class="form-wrapper">
    <div id="found" class="found" style="display: none">
        <p class="hint" data-i18n="pair.omnik-local.found_title">Found on your network</p>
        <div id="found-list"></div>
    </div>

    <form class="homey-form">
        <fieldset class="homey-form-fieldset">
            <div class="homey-form-group">
                <label class="homey-form-label" for="ip_address" data-i18n="pair.omnik-local.ip_address">IP
                    address</label>
                <input class="homey-form-input"
                       id="ip_address"
                       oninput="ipAddressChanged(this.value)"
                       type="text"
                       minlength="7"
                       maxlength="15"
                       pattern="^((\d{1,2}|1\d\d|2[0-4]\d|25[0-5])\.){3}(\d{1,2}|1\d\d|2[0-4]\d|25[0-5])$"
                       placeholder="192.168.0.0"
                       value=""/>
            </div>
            <p class="hint" data-i18n="pair.omnik-local.ip_hint">
                Enter the IP address of your Omnik inverter's WiFi module. The app will auto-detect the rest.
            </p>
        </fieldset>
    </form>

    <div class="footer">
        <p class="alert help">
            <span data-i18n="pair.help.need_help_pairing">Need help pairing?</span>
            <a href="https://homey-omnik.gitbook.io/en/pairing"
               data-i18n="pair.help.click_here_documentation">Click here to view the documentation.</a>
        </p>
    </div>
</div>

<script type="application/javascript">
    Homey.setTitle(Homey.__("pair.omnik-local.title"));
    Homey.setSubtitle(Homey.__("pair.omnik-local.subtitle"));

    Homey.on("alert", function (message) {
        Homey.alert(message);
    });

    Homey.emit("getIpAddress").then(function (ipAddress) {
        document.getElementById("ip_address").value = ipAddress || "";
    });

    function ipAddressChanged(value) {
        Homey.emit("setIpAddress", value);
    }

    function useModule(module) {
        document.getElementById("ip_address").value = module.ip;
        Homey.emit("setIpAddress", module.ip).then(function () {
            Homey.showView("probing");
        });
    }

    // Modules Homey found by MAC address; entering an IP by hand keeps working without them.
    Homey.emit("scanNetwork").then(function (modules) {
        if (!modules || modules.length === 0) return;
        const list = document.getElementById("found-list");
        modules.forEach(function (module) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "homey-button-secondary-full found-item";
            button.textContent = module.ip + "  (" + module.mac + ")";
            button.addEventListener("click", function () { useModule(module); });
            list.appendChild(button);
        });
        document.getElementById("found").style.display = "block";
    }).catch(function () {});
</script>

<style type="text/css">
    .form-wrapper {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
    }

    .found {
        width: 100%;
        margin-bottom: 1rem;
    }

    .found-item {
        margin-top: 0.5rem;
    }

    .footer {
        margin-top: auto;
        padding-top: 1.5rem;
    }

    .alert {
        position: relative;
        padding: 0.75rem 1.25rem;
        margin-bottom: 1rem;
        border: 1px solid transparent;
        border-radius: 0.25rem;
    }

    .hint {
        margin-top: 0.5rem;
        color: #6c757d;
        font-size: 0.875rem;
    }

    .help {
        color: #383d41;
        background-color: #f4f5f5;
        border-color: #e4e5e7;
    }
</style>
