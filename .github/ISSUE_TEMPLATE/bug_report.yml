name: Bug report
description: Something in the app doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please send a diagnostic report right after the problem happens:
        Homey app > More > Apps > this app > settings (cog) > Send diagnostic report.
        Put your GitHub username in the message and paste the Log ID below.
  - type: input
    id: app-version
    attributes:
      label: App version and channel
      placeholder: "1.4.2 (Live)"
    validations:
      required: true
  - type: input
    id: homey
    attributes:
      label: Homey model and firmware
      placeholder: "Homey Pro (Early 2023), 12.9.1"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model and firmware
      placeholder: "Model, firmware version"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: log-id
    attributes:
      label: Diagnostic report Log ID
      placeholder: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
  - type: markdown
    attributes:
      value: Please don't paste passwords, tokens or IP addresses you consider private.
