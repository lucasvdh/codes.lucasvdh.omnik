<!DOCTYPE html>
<html>
<head>
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    body { padding: 1rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    h1 { font-size: 1.2rem; margin: 0 0 0.5rem 0; }
    p.lead { color: #555; margin: 0 0 1rem 0; line-height: 1.4; font-size: 0.92rem; }
    .tabs { display: flex; gap: 0.25rem; margin-bottom: 1rem; border-bottom: 1px solid #ddd; }
    .tab { padding: 0.5rem 0.9rem; cursor: pointer; border: 1px solid transparent; border-bottom: none; border-radius: 4px 4px 0 0; font-size: 0.92rem; color: #555; background: transparent; }
    .tab.active { background: white; border-color: #ddd; color: #eda328; margin-bottom: -1px; }
    .pane { display: none; }
    .pane.active { display: block; }
    .row { display: flex; gap: 0.5rem; align-items: stretch; margin-bottom: 0.75rem; flex-wrap: wrap; }
    select, input[type="text"] { flex: 1 1 200px; min-width: 0; max-width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem; text-overflow: ellipsis; }
    button { padding: 0.5rem 1rem; border-radius: 4px; border: 1px solid #eda328; background: #eda328; color: white; cursor: pointer; font-size: 0.95rem; }
    button.secondary { background: white; color: #eda328; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button:not(:disabled):hover { filter: brightness(1.05); }
    textarea { width: 100%; height: 320px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.78rem; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; white-space: pre-wrap; overflow-wrap: anywhere; }
    .status { margin-top: 0.5rem; padding: 0.5rem; border-radius: 4px; font-size: 0.88rem; display: none; }
    .status.show { display: block; }
    .status.ok { background: #e6f4ea; color: #1e6c33; }
    .status.err { background: #fce8e8; color: #9b2222; }
    .footer { margin-top: 1rem; font-size: 0.82rem; color: #666; line-height: 1.5; }
    .hint { color: #666; font-size: 0.82rem; margin: -0.25rem 0 0.75rem 0; }
  </style>
</head>
<body>
<h1 data-i18n="settings.title"></h1>
<p class="lead" data-i18n="settings.lead"></p>

<div class="tabs">
  <button class="tab active" data-tab="paired" data-i18n="settings.tab_paired"></button>
  <button class="tab" data-tab="ip" data-i18n="settings.tab_ip"></button>
</div>

<div class="pane active" id="pane-paired">
  <div class="row">
    <select id="device"></select>
    <button id="generate" data-i18n="settings.generate"></button>
  </div>
  <p class="hint" data-i18n="settings.hint_paired"></p>
</div>

<div class="pane" id="pane-ip">
  <div class="row">
    <input id="ip" type="text" data-i18n-placeholder="settings.ip_placeholder" />
    <button id="generate-ip" data-i18n="settings.probe_ip"></button>
  </div>
  <p class="hint" data-i18n="settings.hint_ip"></p>
</div>

<textarea id="output" data-i18n-placeholder="settings.output_placeholder" readonly></textarea>
<div class="row" style="margin-top: 0.5rem;">
  <button id="copy" class="secondary" disabled data-i18n="settings.copy"></button>
</div>
<div id="status" class="status"></div>

<p class="footer">
  <span data-i18n="settings.footer"></span>
  <a href="https://github.com/lucasvdh/codes.lucasvdh.omnik/issues/new" target="_blank" rel="noopener" data-i18n="settings.new_issue"></a>
</p>

<script>
  function onHomeyReady(Homey) {
    // Translate with __token__ replacement done here, so it doesn't depend on Homey.__ token support.
    function t(key, tokens) {
      let text = Homey.__(key) || key;
      Object.keys(tokens || {}).forEach(function (name) {
        text = text.split('__' + name + '__').join(String(tokens[name]));
      });
      return text;
    }
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) {
      el.setAttribute('placeholder', t(el.getAttribute('data-i18n-placeholder')));
    });

    const deviceSelect = document.getElementById('device');
    const generateBtn = document.getElementById('generate');
    const ipInput = document.getElementById('ip');
    const generateIpBtn = document.getElementById('generate-ip');
    const copyBtn = document.getElementById('copy');
    const output = document.getElementById('output');
    const status = document.getElementById('status');

    function showStatus(kind, msg) {
      status.className = 'status show ' + kind;
      status.textContent = msg;
    }
    function clearStatus() {
      status.className = 'status';
      status.textContent = '';
    }

    document.querySelectorAll('.tab').forEach(function (t) {
      t.addEventListener('click', function () {
        document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
        document.querySelectorAll('.pane').forEach(function (x) { x.classList.remove('active'); });
        t.classList.add('active');
        document.getElementById('pane-' + t.dataset.tab).classList.add('active');
        clearStatus();
      });
    });

    Homey.api('GET', '/devices', null, function (err, devices) {
      if (err) {
        showStatus('err', t('settings.status.list_failed', { error: err.message || err }));
        generateBtn.disabled = true;
        return;
      }
      if (!devices || devices.length === 0) {
        const empty = document.createElement('option');
        empty.disabled = true;
        empty.selected = true;
        empty.textContent = t('settings.status.no_devices');
        deviceSelect.appendChild(empty);
        generateBtn.disabled = true;
        return;
      }
      devices.forEach(function (d) {
        const opt = document.createElement('option');
        opt.value = d.id;
        opt.textContent = d.name;
        opt.title = d.id;
        deviceSelect.appendChild(opt);
      });
    });

    // Report runs are async on the server side: the POST returns a runId
    // immediately, and the markdown arrives over realtime events. Track the
    // currently active run so listeners can filter and ignore stale events.
    const WATCHDOG_MS = 90000;
    let activeRun = null;

    function finishRun(kind, msg, markdown) {
      if (!activeRun) return;
      const run = activeRun;
      activeRun = null;
      clearTimeout(run.watchdog);
      run.button.disabled = false;
      run.button.textContent = run.restoreLabel;
      if (markdown != null) {
        output.value = markdown;
        copyBtn.disabled = false;
      }
      showStatus(kind, msg);
    }

    const handlers = {
      'omnik:report:progress': function (data) {
        showStatus('ok', data.message || t('settings.status.running'));
      },
      'omnik:report:complete': function (data) {
        finishRun('ok', t('settings.status.report_ready'), data.markdown || '');
      },
      'omnik:report:error': function (data) {
        finishRun('err', t('settings.status.report_failed', { error: data.message || t('settings.status.unknown_error') }));
      },
    };
    // Events can arrive before the POST callback has told us the runId; keep them until then.
    let starting = false;
    let early = [];
    Object.keys(handlers).forEach(function (event) {
      Homey.on(event, function (data) {
        if (activeRun && data.runId === activeRun.runId) handlers[event](data);
        else if (starting) early.push({ event: event, data: data });
      });
    });

    function startRun(button, runningLabel, restoreLabel, call) {
      if (activeRun) {
        showStatus('err', t('settings.status.already_running'));
        return;
      }
      clearStatus();
      button.disabled = true;
      button.textContent = runningLabel;
      output.value = '';
      copyBtn.disabled = true;
      showStatus('ok', t('settings.status.starting'));
      starting = true;
      early = [];
      call(function (err, result) {
        starting = false;
        if (err) {
          button.disabled = false;
          button.textContent = restoreLabel;
          showStatus('err', t('settings.status.start_failed', { error: err.message || err }));
          return;
        }
        const runId = result && result.runId;
        if (!runId) {
          button.disabled = false;
          button.textContent = restoreLabel;
          showStatus('err', t('settings.status.start_failed', { error: t('settings.status.no_run_id') }));
          return;
        }
        activeRun = {
          runId: runId,
          button: button,
          restoreLabel: restoreLabel,
          watchdog: setTimeout(function () {
            finishRun('err', t('settings.status.timed_out', { seconds: WATCHDOG_MS / 1000 }));
          }, WATCHDOG_MS),
        };
        const buffered = early;
        early = [];
        buffered.forEach(function (e) {
          if (activeRun && e.data.runId === activeRun.runId) handlers[e.event](e.data);
        });
      });
    }

    generateBtn.addEventListener('click', function () {
      const deviceId = deviceSelect.value;
      if (!deviceId) {
        showStatus('err', t('settings.status.pick_device'));
        return;
      }
      startRun(generateBtn, t('settings.generating'), t('settings.generate'), function (cb) {
        Homey.api('POST', '/report', { deviceId: deviceId }, cb);
      });
    });

    generateIpBtn.addEventListener('click', function () {
      const ip = (ipInput.value || '').trim();
      if (!ip) {
        showStatus('err', t('settings.status.enter_ip'));
        return;
      }
      startRun(generateIpBtn, t('settings.probing'), t('settings.probe_ip'), function (cb) {
        Homey.api('POST', '/probe-ip', { ip: ip }, cb);
      });
    });

    copyBtn.addEventListener('click', function () {
      clearStatus();
      if (!output.value) return;
      const finish = function (ok) {
        if (ok) showStatus('ok', t('settings.status.copied'));
        else showStatus('err', t('settings.status.copy_failed'));
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(output.value).then(function () { finish(true); }, function () { finish(false); });
      } else {
        output.select();
        try { finish(document.execCommand('copy')); } catch (e) { finish(false); }
      }
    });

    Homey.ready();
  }
</script>
</body>
</html>
